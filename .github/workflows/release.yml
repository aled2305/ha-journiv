name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Base tag matching the manifest version, for example v0.2.0
        required: true
        type: string
      prerelease:
        description: Publish the next beta, for example v0.2.0-beta.1
        required: true
        default: true
        type: boolean

permissions: {}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base_tag: ${{ steps.release.outputs.base_tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Prepare release tag
        id: release
        env:
          BASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        shell: bash
        run: |
          release_tag="$BASE_TAG"
          if [[ "$PRERELEASE" == "true" ]]; then
            release_number=1
            while gh api --silent \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$BASE_TAG-beta.$release_number" \
              >/dev/null 2>&1; do
              ((release_number += 1))
            done
            release_tag="$BASE_TAG-beta.$release_number"
          fi

          echo "base_tag=$BASE_TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  validate:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BASE_TAG: ${{ needs.prepare.outputs.base_tag }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          comment: false

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@9e9565e68f5a70d874202871f4c4064d23814235 # master

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Validate release version
        shell: bash
        run: |
          if [[ ! "$BASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Base tag must use the format vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          manifest_version="$(python -c 'import json; print(json.load(open("custom_components/journiv/manifest.json"))["version"])')"
          if [[ "$BASE_TAG" != "v$manifest_version" ]]; then
            echo "Base tag $BASE_TAG does not match manifest version $manifest_version" >&2
            exit 1
          fi

      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt

      - name: Run tests
        run: pytest

  release:
    needs:
      - prepare
      - validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - name: Publish GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_options=(
            --target "$GITHUB_SHA"
            --title "$RELEASE_TAG"
            --generate-notes
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            release_options+=(--prerelease --latest=false)
          fi

          gh release create "$RELEASE_TAG" "${release_options[@]}"
